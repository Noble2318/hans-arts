{% extends 'gallery/base.html' %}
{% block title %}About - Hans Arts{% endblock %}

{% block content %}
<section class="section">
    <h2 class="section-title">Kuhusu Msanii</h2>
    <div class="detail-layout">
        <div>
            {% if artist.photo %}
            <img src="{{ artist.photo.url }}" alt="{{ artist.name }}">
            {% endif %}
        </div>
        <div class="detail-info">
            <h1>{{ artist.name|default:"Msanii" }}</h1>
            <p>{{ artist.bio|linebreaks }}</p>
        </div>
    </div>
</section>
{% endblock %}
